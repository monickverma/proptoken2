name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    name: Contracts (forge build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: proptoken-autonomous/contracts
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          persist-credentials: false

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.3

      - run: forge --version
      - run: forge build --sizes
      - run: forge test -vvv

  oracle:
    name: Go oracle (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [oracle-network, proptoken-autonomous/oracle-network]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.*

      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
